services:
  teddy:
    build: .
    ports:
      - "5000:5000"
    environment:
      # ส่งค่าผ่าน env ตอนรัน (docker compose อ่านจากไฟล์ .env บนเครื่อง host ให้อัตโนมัติ)
      - THAILLM_API_KEY=${THAILLM_API_KEY}
      - THAILLM_BASE_URL=${THAILLM_BASE_URL:-http://thaillm.or.th/api/v1}
      - THAILLM_MODEL=${THAILLM_MODEL:-openthaigpt-thaillm-8b-instruct-v7.2}
      - DISABLE_THINKING=${DISABLE_THINKING:-false}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      # เปิด /debug สำหรับดูข้อมูลดิบก่อนส่งเข้า LLM — ใช้ตอนพัฒนาเท่านั้น
      # (endpoint นี้เปิดเผย prompt ทั้งก้อน ห้ามเปิดบนเครื่องจริง)
      - ENABLE_DEBUG=${ENABLE_DEBUG:-true}
      # ตอนพัฒนาแทบไม่จำกัด เพราะชุดทดสอบยิงหลายสิบ request รวดเดียวจาก IP เดียว
      # ถ้าใช้ค่าเดียวกับ production (10/นาที) เทสต์จะโดน 429 แล้วขึ้นว่าพังทั้งที่ระบบปกติ
      # ค่าจริงตอน deploy อยู่ใน docker-compose.prod.yml
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-1000}
    # mount โค้ดจากเครื่อง host -> แก้แล้วเห็นผลทันที ไม่ต้อง build ใหม่
    # ⚠️ ห้ามใช้ ".:/app" (mount ทั้งโฟลเดอร์) เพราะจะบัง /app/chroma_db และ
    # /app/.cache/huggingface ที่สร้างไว้ตอน build (host ไม่มี 2 อันนี้) -> แอปพัง + โหลดโมเดล 2GB ใหม่
    volumes:
      - ./app.py:/app/app.py
      - ./templates:/app/templates
      - ./static:/app/static
    # --reload: gunicorn รีสตาร์ต worker เองเมื่อ app.py เปลี่ยน
    # threads เยอะได้เพราะแต่ละ request ใช้เวลาส่วนใหญ่ "รอ" ThaiLLM ตอบ (งาน I/O)
    # ไม่ใช่การคำนวณ และ thread แชร์โมเดลตัวเดียวกัน แรมจึงแทบไม่เพิ่ม
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 16 --timeout 120 --reload app:app
    restart: unless-stopped
