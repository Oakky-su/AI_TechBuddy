services:
  teddy:
    build: .
    image: rag-ai-techbuddy
    ports:
      - "5000:5000"
    # API key ของ AI แต่ละเจ้า (OLLAMA_API_KEY, THAILLM_API_KEY ...) อ่านจาก .env ทั้งไฟล์
    # จะได้เพิ่ม provider ใน providers.json ได้โดยไม่ต้องมาแก้ไฟล์นี้ทุกครั้ง
    env_file:
      - path: .env
        required: false
    environment:
      # ส่งค่าผ่าน env ตอนรัน (docker compose อ่านจากไฟล์ .env บนเครื่อง host ให้อัตโนมัติ)
      - THAILLM_API_KEY=${THAILLM_API_KEY:-}
      - THAILLM_BASE_URL=${THAILLM_BASE_URL:-https://thaillm.or.th/api/v1}
      - THAILLM_MODEL=${THAILLM_MODEL:-OpenThaiGPT-ThaiLLM-8B-Instruct-v7.2}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      # AI + โหมดเริ่มต้น (ผู้ใช้เปลี่ยนเองได้จากหน้าเว็บ) — id ต้องตรงกับ providers.json
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama-gemma4}
      # ตอนพัฒนาแทบไม่จำกัด เพราะชุดทดสอบยิงหลายสิบ request รวดเดียวจาก IP เดียว
      # ถ้าใช้ค่าเดียวกับ production (10/นาที) เทสต์จะโดน 429 แล้วขึ้นว่าพังทั้งที่ระบบปกติ
      # ค่าจริงตอน deploy อยู่ใน docker-compose.prod.yml
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-1000}
    # mount โค้ดจากเครื่อง host -> แก้แล้วเห็นผลทันที ไม่ต้อง build ใหม่
    # ⚠️ ห้ามใช้ ".:/app" (mount ทั้งโฟลเดอร์) เพราะจะบัง /app/.cache/huggingface
    # ที่สร้างไว้ตอน build (host ไม่มี) -> ต้องโหลดโมเดล 2GB ใหม่ทุกครั้งที่เริ่มแอป
    volumes:
      - ./app.py:/app/app.py
      - ./llm_providers.py:/app/llm_providers.py
      - ./providers.json:/app/providers.json
      - ./templates:/app/templates
      - ./static:/app/static
    # --reload: gunicorn รีสตาร์ต worker เองเมื่อ app.py เปลี่ยน
    # threads เยอะได้เพราะแต่ละ request ใช้เวลาส่วนใหญ่ "รอ" LLM ตอบ (งาน I/O)
    # ไม่ใช่การคำนวณ และ thread แชร์โมเดลตัวเดียวกัน แรมจึงแทบไม่เพิ่ม
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 16 --timeout 180 --reload app:app
    restart: unless-stopped
