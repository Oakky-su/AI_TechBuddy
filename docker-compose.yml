services:
  teddy:
    build: .
    ports:
      - "5000:5000"
    # API key ของ AI แต่ละเจ้า (BMS_LLM_*, OPENAI_API_KEY, ANTHROPIC_API_KEY ...) อ่านจาก .env ทั้งไฟล์
    # จะได้เพิ่ม provider ใน providers.json ได้โดยไม่ต้องมาแก้ไฟล์นี้ทุกครั้ง
    env_file:
      - path: .env
        required: false
    environment:
      # ส่งค่าผ่าน env ตอนรัน (docker compose อ่านจากไฟล์ .env บนเครื่อง host ให้อัตโนมัติ)
      - THAILLM_API_KEY=${THAILLM_API_KEY:-}
      - THAILLM_BASE_URL=${THAILLM_BASE_URL:-https://thaillm.or.th/api/v1}
      - THAILLM_MODEL=${THAILLM_MODEL:-OpenThaiGPT-ThaiLLM-8B-Instruct-v7.2}
      - DISABLE_THINKING=${DISABLE_THINKING:-false}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      # AI + โหมดเริ่มต้น (ผู้ใช้เปลี่ยนเองได้จากหน้าเว็บ) — id ต้องตรงกับ providers.json
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama-gemma4}
      - DEFAULT_ENGINE=${DEFAULT_ENGINE:-classic}
      # Pi Agent: teddy ส่งงานไปที่ pi-agent แล้ว pi-agent เรียก tool กลับมาที่ teddy ด้วย token นี้
      - PI_AGENT_URL=http://pi-agent:7070
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token}
      # เปิด /debug สำหรับดูข้อมูลดิบก่อนส่งเข้า LLM — ใช้ตอนพัฒนาเท่านั้น
      # (endpoint นี้เปิดเผย prompt ทั้งก้อน ห้ามเปิดบนเครื่องจริง)
      - ENABLE_DEBUG=${ENABLE_DEBUG:-true}
      # ตอนพัฒนาแทบไม่จำกัด เพราะชุดทดสอบยิงหลายสิบ request รวดเดียวจาก IP เดียว
      # ถ้าใช้ค่าเดียวกับ production (10/นาที) เทสต์จะโดน 429 แล้วขึ้นว่าพังทั้งที่ระบบปกติ
      # ค่าจริงตอน deploy อยู่ใน docker-compose.prod.yml
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-1000}
    # mount โค้ดจากเครื่อง host -> แก้แล้วเห็นผลทันที ไม่ต้อง build ใหม่
    # ⚠️ ห้ามใช้ ".:/app" (mount ทั้งโฟลเดอร์) เพราะจะบัง /app/chroma_db และ
    # /app/.cache/huggingface ที่สร้างไว้ตอน build (host ไม่มี 2 อันนี้) -> แอปพัง + โหลดโมเดล 2GB ใหม่
    volumes:
      - ./app.py:/app/app.py
      - ./rag_v2.py:/app/rag_v2.py
      - ./llm_providers.py:/app/llm_providers.py
      - ./providers.json:/app/providers.json
      - ./templates:/app/templates
      - ./static:/app/static
    # --reload: gunicorn รีสตาร์ต worker เองเมื่อ app.py เปลี่ยน
    # threads เยอะได้เพราะแต่ละ request ใช้เวลาส่วนใหญ่ "รอ" LLM ตอบ (งาน I/O)
    # ไม่ใช่การคำนวณ และ thread แชร์โมเดลตัวเดียวกัน แรมจึงแทบไม่เพิ่ม
    # (โหมด Pi Agent ต้องมี thread ว่างเสมอ เพราะ /chat รอ pi-agent ซึ่งเรียก /internal/tools กลับมา)
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 16 --timeout 180 --reload app:app
    depends_on:
      - pi-agent
    restart: unless-stopped

  # Pi Agent (pi.dev) — agent loop ที่ให้ AI เรียก tool ค้นข้อมูลเพิ่มเองได้หลายรอบ
  # ไม่เปิด port ออกนอก: request จาก teddy มี API key ของ provider ติดมาด้วย
  pi-agent:
    build: ./pi-agent
    environment:
      - TOOLS_URL=http://teddy:5000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-internal-token}
      # 1 = log สรุป payload ที่ส่งให้ LLM (ดูว่า tool ถูกประกาศไหม) — ใช้ตอนไล่ปัญหา
      - PI_DEBUG=${PI_DEBUG:-0}
    volumes:
      - ./pi-agent/server.mjs:/app/server.mjs
    # --watch: แก้ server.mjs แล้ว node รีสตาร์ตเอง
    command: node --watch server.mjs
    restart: unless-stopped
