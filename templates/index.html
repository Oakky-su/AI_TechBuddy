<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Buddy — ผู้ช่วยเลือกโน้ตบุ๊ค</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>
  // ตั้งธีมก่อนวาดหน้า กัน "แฟลชขาว" ตอนโหลดในโหมดมืด
  (function () {
    var saved = localStorage.getItem('tb-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
  })();
</script>
</head>
<body>

<!-- ───────────── SIDEBAR ───────────── -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="12" rx="2"/>
        <path d="M2 20h20"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">Tech Buddy</span>
      <span class="brand-sub">ผู้ช่วยเลือกโน้ตบุ๊ค</span>
    </div>
  </div>

  <button class="new-chat-btn" id="newChatBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    แชทใหม่
  </button>

  <div class="history-section">
    <p class="history-label">ประวัติการสนทนา</p>
    <div id="historyList" class="history-list"></div>
    <p class="history-empty" id="historyEmpty">ยังไม่มีบทสนทนา</p>
  </div>

  <button class="clear-all-btn" id="clearAllBtn" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
    </svg>
    <span id="clearAllLabel">ล้างประวัติทั้งหมด</span>
  </button>

  <div class="sidebar-foot">
    <span class="rag-dot"></span>
    <span>RAG พร้อมใช้งาน · 99 รุ่น</span>
  </div>
</aside>

<!-- ───────────── MAIN ───────────── -->
<main class="chat-area">
  <header class="topbar">
    <button class="icon-btn" id="themeToggle" title="สลับโหมดสว่าง / มืด" aria-label="สลับโหมดสว่างและโหมดมืด">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
      </svg>
    </button>
  </header>

  <div id="messages" class="messages">
    <!-- การ์ดเริ่มต้นการสนทนา + ตัวอย่างคำถาม -->
    <section class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 13.5H5.5A2.5 2.5 0 013 11V6.5A2.5 2.5 0 015.5 4h9A2.5 2.5 0 0117 6.5V7"/>
          <path d="M9.5 10h9a2.5 2.5 0 012.5 2.5V17a2.5 2.5 0 01-2.5 2.5H14l-3.5 2.5v-2.5H9.5A2.5 2.5 0 017 17v-4.5A2.5 2.5 0 019.5 10z"/>
        </svg>
      </div>
      <h1 class="empty-title">เริ่มต้นการสนทนา</h1>
      <p class="empty-sub">บอกงบประมาณและการใช้งาน แล้ว Tech Buddy จะช่วยเลือกโน้ตบุ๊คให้ แบบตรงไปตรงมา ไม่เชียร์ขาย</p>
      <div class="chips" id="chips">
        <button class="chip">โน้ตบุ๊คเล่นเกม งบ 25,000</button>
        <button class="chip">ทำงานเอกสาร เรียนออนไลน์ งบ 20,000</button>
        <button class="chip">ตัดต่อวิดีโอ งบ 40,000</button>
        <button class="chip">แบตอึด พกพาสะดวก งบ 30,000</button>
        <button class="chip">รุ่นไหนถูกที่สุดในร้าน</button>
        <button class="chip">ร้านมีกี่รุ่น ราคาเริ่มต้นเท่าไหร่</button>
        <button class="chip">RTX 4060 รุ่นไหนคุ้มสุด</button>
        <button class="chip">จอสวย ทำงานกราฟิก งบ 45,000</button>
      </div>
    </section>
  </div>

  <div class="composer">
    <div class="input-bar">
      <input id="userInput" type="text" autocomplete="off" maxlength="1000"
             placeholder="พิมพ์ข้อความของคุณ..." />
      <button class="send-btn" id="sendBtn" title="ส่งข้อความ" aria-label="ส่งข้อความ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="composer-note">Tech Buddy ตอบจากข้อมูลสินค้าในร้านเท่านั้น · ควรตรวจสอบราคาอีกครั้งก่อนตัดสินใจซื้อ</p>
  </div>
</main>

<script src="/static/js/main.js"></script>
</body>
</html>
